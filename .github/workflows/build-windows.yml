name: Build Viper for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract integrated Viper source
        shell: pwsh
        run: Expand-Archive -LiteralPath viper-source.zip -DestinationPath . -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Viper installer
        uses: actions/upload-artifact@v4
        with:
          name: Viper-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
